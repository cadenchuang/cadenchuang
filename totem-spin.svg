<svg xmlns="http://www.w3.org/2000/svg" width="220" height="260" viewBox="0 0 220 260" role="img" aria-label="Spinning totem">
  <title>the totem, still spinning</title>
  <!--
    The totem from Inception, drawn in ASCII, spinning forever.
    The spin is a scaleX oscillation (rotation about the vertical axis)
    plus a slight wobble, like a top that never quite falls.
  -->
  <g transform="translate(110,14)">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b8860b" text-anchor="middle">
      <animateTransform attributeName="transform" type="scale"
        values="1 1; 0.12 1; -1 1; -0.12 1; 1 1" keyTimes="0; 0.25; 0.5; 0.75; 1"
        dur="2.4s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate"
        values="-2.5 0 210; 2.5 0 210; -2.5 0 210" keyTimes="0; 0.5; 1"
        dur="2.4s" repeatCount="indefinite" additive="sum"/>
      <text x="0" y="0">/\</text>
      <text x="0" y="15">/  \</text>
      <text x="0" y="30">/    \</text>
      <text x="0" y="45">|      |</text>
      <text x="0" y="60">|      |</text>
      <text x="0" y="75">|      |</text>
      <text x="0" y="90">\    /</text>
      <text x="0" y="105">\  /</text>
      <text x="0" y="120">______ \/ ______</text>
      <text x="0" y="135">/                \</text>
      <text x="0" y="150">|__________________|</text>
      <text x="0" y="165">\      /</text>
      <text x="0" y="180">\    /</text>
      <text x="0" y="195">\  /</text>
      <text x="0" y="210">\/</text>
    </g>
    <ellipse cx="0" cy="228" rx="34" ry="5" fill="#b8860b" opacity="0.25">
      <animate attributeName="rx" values="34; 12; 34; 12; 34" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25; 0.12; 0.25; 0.12; 0.25" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
