<svg xmlns="http://www.w3.org/2000/svg" width="700" height="210" viewBox="0 0 700 210" role="img" aria-label="A prediction market line drawing itself">
  <title>the market, live</title>
  <!--
    A Kalshi-style market line that draws itself, like Rainmaker watching a race.
    One thin line, green, with a glowing dot riding the leading edge and the
    YES price ticking as it moves. Then it fades and draws a new path.
    Loop is 10s. All keyTimes start at 0 (SMIL rule — animations with a
    first keyTime above 0 are ignored by browsers).
  -->
  <defs>
    <path id="line" d="M 30,150 L 90,138 L 150,148 L 210,118 L 270,128 L 330,98 L 390,112 L 450,78 L 510,92 L 570,62 L 630,74 L 670,58" fill="none"/>
    <path id="area" d="M 30,150 L 90,138 L 150,148 L 210,118 L 270,128 L 330,98 L 390,112 L 450,78 L 510,92 L 570,62 L 630,74 L 670,58 L 670,178 L 30,178 Z" fill="#3fb950"/>
  </defs>
  <rect x="5" y="5" width="690" height="200" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="30" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#e6edf3">will ai agents trade better than humans?</text>
  <text x="670" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950" text-anchor="end" opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.3;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>YES 61&#162;</text>
  <text x="670" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;0.6" calcMode="discrete" dur="10s" repeatCount="indefinite"/>YES 62&#162;</text>
  <text x="670" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.6;0.85;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>YES 63&#162;</text>
  <g stroke="#21262d" stroke-width="1">
    <line x1="30" y1="80" x2="670" y2="80"/>
    <line x1="30" y1="115" x2="670" y2="115"/>
    <line x1="30" y1="150" x2="670" y2="150"/>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;0.95" dur="10s" repeatCount="indefinite"/>
    <use href="#area" opacity="0">
      <animate attributeName="opacity" values="0;0.07" keyTimes="0;0.6" dur="10s" repeatCount="indefinite"/>
    </use>
    <use href="#line" stroke="#3fb950" stroke-width="7" opacity="0.18" stroke-linejoin="round" stroke-linecap="round"/>
    <use href="#line" stroke="#3fb950" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100;0" keyTimes="0;0.6" dur="10s" repeatCount="indefinite"/>
    </use>
    <g>
      <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;0.6" calcMode="linear">
        <mpath href="#line"/>
      </animateMotion>
      <circle r="11" fill="#3fb950" opacity="0.25"/>
      <circle r="5" fill="#3fb950"/>
      <circle r="2" fill="#e6edf3"/>
    </g>
  </g>
  <text x="30" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">6H&#160;&#160;1D&#160;&#160;1W&#160;&#160;1M&#160;&#160;ALL</text>
  <text x="670" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e" text-anchor="end">rainmaker &#183; paper trading</text>
</svg>
